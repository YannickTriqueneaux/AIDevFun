name: Auto-tests

on:
  push:
  pull_request:

jobs:
  headless-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DGAME_PROJECT=BaseGame -DCMAKE_BUILD_TYPE=Debug

      - name: Build headless auto-tests
        run: cmake --build build --config Debug --target AutoTests

      - name: Run headless auto-tests
        run: ctest --test-dir build -C Debug --output-on-failure
